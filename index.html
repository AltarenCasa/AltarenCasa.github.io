<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1020">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Altar en Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<title>Altar en Casa</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Kaushan+Script&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
  /* Layout: una columna para celular, mucho aire y una sola idea por pantalla.
     Noche azul con luz de vela dorada, como la imagen de la campaña. Una sola apariencia oscura, a propósito. */
  :root {
    --noche: #0D1020;
    --noche-2: #151A30;
    --noche-3: #1E2440;
    --oro: #E7B65A;
    --oro-claro: #F7DB97;
    --crema: #F4ECDD;
    --gris: #A8A3B8;
    --linea: rgba(231, 182, 90, .22);
    --ok: #7DD3A0;
    --f-mayus: "Cinzel", "Times New Roman", serif;
    --f-pincel: "Kaushan Script", "Brush Script MT", cursive;
    --f-lectura: "Lora", Georgia, serif;
    --f-ui: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--noche); color: var(--crema); font-family: var(--f-ui); font-size: 16px; line-height: 1.55;
    padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    background-image: radial-gradient(120% 60% at 50% -10%, #2A2140 0%, transparent 60%); background-attachment: fixed; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--noche); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--oro-claro); }
  :focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .app { max-width: 520px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 16px 12px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  .mayus { font-family: var(--f-mayus); letter-spacing: .08em; text-transform: uppercase; }
  .pincel { font-family: var(--f-pincel); color: var(--oro); font-weight: 400; }
  .marca { display: flex; align-items: baseline; justify-content: center; gap: 10px; padding-block: 4px 14px; }
  .marca .pincel { font-size: 30px; line-height: 1; }
  .marca .mayus { font-size: 15px; color: var(--crema); }
  .sub { color: var(--gris); font-size: 14.5px; margin: 0; }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--oro); }
  .tarjeta { background: var(--noche-2); border: 1px solid var(--linea); border-radius: 24px; padding: 22px 20px; margin-bottom: 18px; }
  .tarjeta h2 { font-family: var(--f-mayus); font-size: 17px; letter-spacing: .05em; color: var(--oro-claro); }
  .pila { display: grid; gap: 14px; }
  .flyer { width: 100%; border-radius: 24px; display: block; border: 1px solid var(--linea); margin-bottom: 18px; }
  .centro { text-align: center; }

  /* Vela */
  .altar-vela { display: grid; justify-items: center; gap: 8px; position: relative; padding-block: 4px; }
  .halo { position: absolute; top: -40px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 179, 71, .35) 0%, rgba(255, 179, 71, 0) 65%); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  .encendida .halo { opacity: 1; }
  .vela { position: relative; width: 220px; height: 200px; display: block; margin-top: 6px; border: 0; background: none; padding: 0; }
  .vela svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .vela .fuego, .vela .f1, .vela .f2, .vela .f3 { transform-origin: 110px 98px; }
  .vela .fuego { transform: scale(0); opacity: 0; transition: transform 1s cubic-bezier(.2, 1.3, .4, 1), opacity .4s ease; }
  .encendida .vela .fuego { transform: scale(1); opacity: 1; }
  .vela .brillo { opacity: 0; transition: opacity 1.4s ease; }
  .encendida .vela .brillo { opacity: .5; }
  .vela .brasa { transition: fill 1s ease; }
  .encendida .vela .brasa { fill: #FF8A3A; }
  @media (prefers-reduced-motion: no-preference) {
    .encendida .vela .f1 { animation: llamear 2.2s ease-in-out infinite .9s; }
    .encendida .vela .f2 { animation: llamear 1.6s ease-in-out infinite reverse .9s; }
    .encendida .vela .f3 { animation: llamear 1.2s ease-in-out infinite .9s; }
  }
  @keyframes llamear { 0%, 100% { transform: scale(1, 1) skewX(0); } 30% { transform: scale(1.04, .95) skewX(2deg); } 65% { transform: scale(.96, 1.06) skewX(-2.5deg); } }
  button.vela { cursor: pointer; }
  .cera { width: 50px; height: 96px; border-radius: 10px 10px 6px 6px; background: linear-gradient(90deg, #E9DCC4 0%, #FFF6E6 45%, #D9C7A6 100%); }
  .mecha { position: absolute; bottom: 94px; width: 3px; height: 12px; border-radius: 2px; background: #3A2A1A; }
  .llama { position: absolute; bottom: 102px; width: 24px; height: 44px; border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 75%, #FFFDF2 0%, #FFE08A 30%, #FFB347 60%, rgba(255, 120, 40, 0) 75%);
    transform-origin: 50% 90%; transform: scale(0); transition: transform .9s cubic-bezier(.2,.8,.2,1.2); }
  .encendida .llama { transform: scale(1); }
  @media (prefers-reduced-motion: no-preference) { .encendida .llama { animation: titila 2.6s ease-in-out infinite .9s; } }
  @keyframes titila { 0%, 100% { transform: scale(1) rotate(-1deg); } 30% { transform: scale(1.04, .97) rotate(1.5deg); } 60% { transform: scale(.97, 1.04) rotate(-1.5deg); } }
  .vela-txt { text-align: center; font-family: var(--f-lectura); font-style: italic; color: var(--gris); max-width: 30ch; font-size: 15.5px; margin: 0; }
  .encendida .vela-txt { color: var(--oro-claro); }

  /* Botones */
  .btn { border: 0; border-radius: 16px; padding: 15px 18px; font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .btn-oro { background: linear-gradient(180deg, var(--oro-claro), var(--oro)); color: #2A1C05; box-shadow: 0 8px 24px rgba(231, 182, 90, .22); }
  .btn-borde { background: transparent; color: var(--crema); border: 1.5px solid var(--linea); }
  .btn-cal { background: #fff; color: #1F1F1F; }
  .btn-chico { padding: 10px 14px; font-size: 14.5px; border-radius: 12px; }
  .w100 { width: 100%; }
  .link-cal { background: none; border: 0; padding: 0; font: inherit; color: var(--oro-claro); text-decoration: underline; cursor: pointer; }
  .peligro { background: none; border: 0; color: #F28B82; font-weight: 800; font-size: 14.5px; padding: 8px 0; text-align: left; }

  /* Inicio */
  .resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dato { background: var(--noche-3); border-radius: 18px; padding: 14px; text-align: center; }
  .dato strong { display: block; font-family: var(--f-mayus); font-size: 24px; color: var(--oro-claro); line-height: 1.15; }
  .dato span { font-size: 13px; color: var(--gris); font-weight: 700; }
  .estado-semana { display: flex; align-items: center; gap: 12px; background: var(--noche-3); border-radius: 18px; padding: 14px 16px; }
  .estado-semana .ico { font-size: 22px; width: 28px; text-align: center; }
  .estado-semana b { display: block; font-size: 15px; }
  .estado-semana small { color: var(--gris); font-size: 13.5px; }
  .estado-semana.ok b { color: var(--ok); }
  .objetivos { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
  .objetivos li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; font-size: 15px; }
  .objetivos b { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--oro); color: var(--oro); display: grid; place-items: center; font-family: var(--f-mayus); font-size: 14px; }
  .horario-resumen { display: flex; align-items: center; gap: 12px; background: var(--noche-3); border-radius: 16px; padding: 14px; }
  .horario-resumen .ico { font-size: 24px; }
  .horario-resumen b { display: block; color: var(--oro-claro); font-size: 16px; }
  .horario-resumen small { color: var(--gris); font-size: 13px; }

  /* Altar guiado */
  .fluir { background: var(--noche-2); border: 1px solid var(--linea); border-radius: 20px; padding: 20px 20px 22px; display: grid; gap: 18px; font-family: var(--f-lectura); font-size: 17.5px; line-height: 1.65; }
  .fluir p { margin: 0; }
  .fluir .obj-marca { color: var(--oro-claro); font-weight: 700; }
  .fluir blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--oro); font-style: italic; font-size: 16.5px; }
  .fluir blockquote .cita { padding: 0; }
  .fluir .declaracion { margin: 4px 0; }
  .fluir .palabra { border-top: 1px solid var(--linea); padding-top: 16px; display: grid; gap: 6px; }
  .fluir .palabra .versiculo { font-size: 19px; margin-top: 6px; }
  .fluir .pregunta { font-size: 16.5px; margin-top: 10px; color: var(--gris); }
  .fluir .peticiones-linea { font-size: 15.5px; color: var(--gris); text-align: center; margin-top: -8px; }
  .bendicion { margin: 14px 0 0; }
  .fluir .pregunta b { font-family: var(--f-texto, inherit); color: var(--oro-claro); }
  .paso { display: grid; gap: 24px; padding-top: 6px; }
  .paso-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .progreso { display: flex; gap: 6px; }
  .progreso i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12.5px; font-weight: 800; color: var(--gris); border: 1.5px solid var(--noche-3); }
  .progreso i.hecho { background: var(--oro); border-color: var(--oro); color: #2A1C05; }
  .progreso i.actual { border-color: var(--oro); color: var(--oro-claro); }
  .paso-cab { display: grid; gap: 10px; }
  .paso-cab .eyebrow { font-size: 16px; letter-spacing: .12em; }
  .palabra-sem > .eyebrow { font-size: 19px; letter-spacing: .08em; line-height: 1.35; display: block; margin-bottom: 4px; }
  .paso-cab h1 { font-family: var(--f-pincel); font-weight: 400; color: var(--oro-claro); font-size: clamp(36px, 10vw, 46px); line-height: 1.1; }
  .paso-cab p { margin: 0; font-family: var(--f-lectura); font-size: 18px; line-height: 1.6; }
  .que-hacer { background: var(--noche-2); border: 1px solid var(--linea); border-radius: 18px; padding: 16px 18px; }
  .que-hacer ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
  .que-hacer li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 16px; line-height: 1.45; }
  .que-hacer li b { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--oro); color: var(--oro); display: grid; place-items: center; font-size: 13px; }
  .acciones { display: grid; gap: 12px; }
  .accion { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: center; background: var(--noche-2); border: 1px solid var(--linea); border-radius: 18px; padding: 16px; font-size: 16px; line-height: 1.45; }
  .accion .ico { font-size: 22px; text-align: center; }
  .destacado { background: rgba(231, 182, 90, .1); border: 1px solid var(--linea); border-radius: 20px; padding: 18px; }
  .destacado b { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--oro); margin-bottom: 8px; }
  .destacado p { margin: 0; font-family: var(--f-lectura); font-size: 18px; line-height: 1.6; }
  .versiculo { font-family: var(--f-lectura); font-size: 21px; line-height: 1.6; font-style: italic; margin: 0; border-left: 3px solid var(--oro); padding-left: 16px; }
  .cita { font-family: var(--f-mayus); font-size: 13px; letter-spacing: .12em; color: var(--oro); display: block; margin-top: 8px; padding-left: 19px; }
  .declaracion { font-family: var(--f-mayus); font-size: 20px; letter-spacing: .05em; line-height: 1.55; color: var(--oro-claro); text-align: center; margin: 0; }
  details.extra { background: var(--noche-2); border: 1px solid var(--linea); border-radius: 18px; }
  details.extra summary { list-style: none; cursor: pointer; padding: 15px 18px; font-weight: 800; color: var(--oro-claro); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.extra summary::-webkit-details-marker { display: none; }
  details.extra summary::after { content: "+"; font-size: 22px; line-height: 1; }
  details.extra[open] summary::after { content: "−"; }
  details.extra .cuerpo { padding: 0 18px 18px; font-family: var(--f-lectura); font-size: 17px; line-height: 1.65; font-style: italic; }
  .paso > .dirige { justify-self: start; margin-bottom: -10px; }
  .dirige { display: inline-flex; gap: 8px; align-items: center; background: var(--noche-3); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700; justify-self: center; }
  .musica { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .musica span { color: var(--gris); font-size: 14.5px; }
  .peticiones-mini { display: grid; gap: 8px; }
  .nav-paso { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding-top: 6px; }

  /* Lecturas */
  .semana { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--noche-2); border: 1px solid var(--linea); border-radius: 18px; padding: 14px; margin-bottom: 10px; color: var(--crema); }
  .semana-n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mayus); font-weight: 700; border: 1.5px solid var(--linea); color: var(--gris); }
  .semana.hecha .semana-n { background: var(--oro); color: #2A1C05; border-color: var(--oro); }
  .semana.sigue { border-color: var(--oro); }
  .semana.sigue .semana-n { border-color: var(--oro); color: var(--oro-claro); }
  .semana b { display: block; font-size: 15.5px; }
  .semana small { color: var(--gris); font-size: 13px; }
  .semana.bloqueada { opacity: .45; cursor: default; }
  .semana .candado { color: var(--gris); }
  .sin-config .tabbar { display: none; }
  .semana em { font-style: normal; font-size: 12.5px; font-weight: 800; color: var(--oro); }

  /* Formularios */
  .campo { width: 100%; background: var(--noche-3); border: 1.5px solid var(--linea); border-radius: 14px; padding: 13px; color: var(--crema); min-width: 0; }
  .campo::placeholder { color: #7E7891; }
  .campo:focus { outline: none; border-color: var(--oro); }
  .lbl { display: block; font-weight: 800; font-size: 14px; margin: 16px 0 8px; }
  .que-es { font-style: normal !important; font-size: 15.5px !important; }
  .que-es p { margin: 0 0 10px; } .que-es ul { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 4px; }
  .que-es .v-corto { font-style: italic; margin: 0; } .que-es .cita { display: block; margin-top: 4px; }
  .leña { text-align: center; color: var(--gris); font-size: 14.5px; margin: 4px 0 0; } .leña b { color: var(--oro-claro); }
  .ayuda { color: var(--gris); font-size: 13.5px; margin: 8px 0 0; }
  .dias-sem { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dia-sem { border: 1.5px solid var(--linea); background: var(--noche-3); color: var(--gris); border-radius: 12px; padding: 11px 0; font-weight: 800; font-size: 14px; }
  .dia-sem[aria-pressed="true"] { background: var(--oro); border-color: var(--oro); color: #2A1C05; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--noche-3); border: 1px solid var(--linea); border-radius: 999px; padding: 7px 7px 7px 13px; font-weight: 700; font-size: 14.5px; }
  .chip button { border: 0; background: rgba(255,255,255,.08); color: var(--gris); width: 24px; height: 24px; border-radius: 50%; font-size: 12px; }
  .fila { display: flex; gap: 8px; }

  /* Oración */
  .segmento { display: grid; grid-template-columns: 1fr 1fr; background: var(--noche-3); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
  .segmento button { border: 0; background: none; border-radius: 11px; padding: 11px 6px; font-weight: 800; color: var(--gris); }
  .segmento button[aria-pressed="true"] { background: var(--noche-2); color: var(--oro-claro); box-shadow: 0 0 0 1px var(--linea) inset; }
  .peticion { border-top: 1px solid var(--linea); padding-block: 14px; display: grid; gap: 6px; }
  .peticion:first-child { border-top: 0; padding-top: 0; }
  .peticion-t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .peticion-t b { font-size: 16px; overflow-wrap: anywhere; }
  .peticion-t small { color: var(--gris); font-size: 12.5px; white-space: nowrap; }
  .peticion p { margin: 0; font-family: var(--f-lectura); font-size: 16px; overflow-wrap: anywhere; }
  .respondida { color: var(--ok); font-weight: 800; font-size: 13.5px; }

  /* Pestañas */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(13, 16, 32, .95); backdrop-filter: blur(10px); border-top: 1px solid var(--linea);
    display: grid; grid-template-columns: repeat(3, 1fr); padding-top: 6px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .tab { border: 0; background: none; color: var(--gris); display: grid; justify-items: center; gap: 2px; padding: 6px 2px; font-size: 12px; font-weight: 700; }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-current="page"] { color: var(--oro-claro); }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--oro-claro); color: #2A1C05; font-weight: 800; border-radius: 999px; padding: 11px 18px; z-index: 40; max-width: calc(100% - 32px); text-align: center; font-size: 14.5px; }
  .final { text-align: center; display: grid; gap: 20px; justify-items: center; padding-top: 10px; }
  .final h1 { font-family: var(--f-pincel); font-weight: 400; color: var(--oro-claro); font-size: 46px; }

  /* v2: reloj, cuadro de pasos, guías, Palabra, iglesia */
  .reloj-fila { display: grid; justify-items: center; gap: 10px; margin-top: -6px; }
  .reloj { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #FF9F43, #E8572A); color: #fff; border-radius: 999px; padding: 10px 22px; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; box-shadow: 0 8px 26px rgba(232, 87, 42, .35); letter-spacing: .02em; }
  .reloj small { font-size: 15px; font-weight: 700; opacity: .9; }
  .reloj svg { width: 26px; height: 26px; }
  .reloj.cumplido { background: linear-gradient(180deg, #7EE0A6, #3DAA6B); box-shadow: 0 8px 26px rgba(61, 170, 107, .35); }
  .btn-musica { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--linea); background: var(--noche-2); color: var(--crema); border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
  .btn-musica svg { width: 18px; height: 18px; color: var(--oro); }
  .btn-musica.on { background: var(--oro-claro); color: #2A1C05; border-color: var(--oro-claro); }
  .btn-musica.on svg { color: #2A1C05; }
  .cuadro-pasos { background: var(--noche-2); border: 1px solid var(--linea); border-radius: 18px; padding: 16px 18px; }
  .cuadro-pasos ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
  .cuadro-pasos li, .puntos li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: center; font-size: 16px; }
  .cuadro-pasos li b, .puntos li b { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--oro); color: var(--oro); display: grid; place-items: center; font-size: 13px; font-family: var(--f-mayus); }
  .guia { background: var(--noche-2); border: 1px solid var(--linea); border-radius: 18px; padding: 16px 18px; display: grid; gap: 8px; }
  .guia p { margin: 0; font-family: var(--f-lectura); font-size: 17px; line-height: 1.6; font-style: italic; }
  .guia ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 16px; line-height: 1.45; }
  .palabra-sem { display: grid; gap: 8px; }
  .puntos { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
  .puntos li { align-items: start; line-height: 1.45; }
  .puntos .punto-tit { font-weight: 700; }
  .ok-avisos { margin: 0; font-weight: 700; color: #7EE0A6; }
  html[data-tema="claro"] .ok-avisos { color: #1E7A45; }
  .sub-puntos { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .sub-puntos li { display: block; position: relative; padding-left: 16px; font-weight: 400; }
  .sub-puntos li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--oro); }
  .versiculo sup { font-style: normal; font-size: .62em; color: var(--oro); margin-right: 3px; font-weight: 700; }
  .iglesia-txt { margin: 0; white-space: normal; line-height: 1.55; }
  .duracion { margin: -8px 0 0; color: var(--gris); font-size: 16px; }
  .duracion b { color: var(--oro-claro); }
  .cartel-fondo { position: fixed; inset: 0; z-index: 50; background: rgba(6, 8, 18, .86); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; overflow-y: auto; animation: aparecer .5s ease; }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  .cartel { width: 100%; max-width: 420px; background: radial-gradient(120% 80% at 50% 0%, #2A2346 0%, var(--noche-2) 60%); border: 1px solid var(--linea); border-radius: 26px; padding: 26px 20px 20px; display: grid; gap: 16px; text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  .cartel-logo { width: 82%; max-width: 300px; justify-self: center; display: block; }
  .reuniones { display: grid; gap: 8px; }
  .reunion { background: var(--noche); border: 1px solid var(--linea); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
  .reunion b { color: var(--oro-claro); font-size: 17px; }
  .reunion span { font-size: 16px; }
  .cartel-anuncio { display: grid; gap: 6px; border-top: 1px solid var(--linea); padding-top: 14px; }
  .cartel-anuncio p { margin: 0; line-height: 1.55; }
  .codigo-familia { font-family: var(--f-mayus); font-size: 34px; letter-spacing: .14em; color: var(--oro-claro); margin: 4px 0; font-weight: 700; }
  .codigo-campo { text-align: center; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; }
  .btn-mini { justify-self: center; background: none; border: 1px solid var(--linea); color: var(--gris); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .pasos-alarma { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; line-height: 1.45; }
  .reflexion textarea { resize: vertical; min-height: 120px; font-family: var(--f-lectura); font-size: 17px; line-height: 1.55; }
  .tamanos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tamanos button { border: 1.5px solid var(--linea); background: var(--noche-2); color: var(--crema); border-radius: 14px; padding: 10px 4px; display: grid; justify-items: center; gap: 4px; font: inherit; cursor: pointer; min-height: 72px; align-content: end; }
  .tamanos button span { font-weight: 800; line-height: 1; }
  .tamanos button small { font-size: 12.5px; color: var(--gris); font-weight: 700; }
  .tamanos button[aria-pressed="true"] { border-color: var(--oro); background: rgba(231, 182, 90, .12); }
  .tamanos button[aria-pressed="true"] span, .tamanos button[aria-pressed="true"] small { color: var(--oro-claro); }
  .modal-fondo { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 18, .7); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: aparecer .2s ease; }
  .modal { width: 100%; max-width: 380px; background: var(--noche-2); border: 1px solid var(--linea); border-radius: 22px; padding: 22px 20px 18px; display: grid; gap: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
  .modal h2 { margin: 0; font-family: var(--f-lectura); font-size: 22px; color: var(--oro-claro); }
  .modal p { margin: 0; line-height: 1.55; color: var(--crema); }
  .modal-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .que-es-caja { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--linea); }
  .que-es-tit { margin: 0 0 10px; font-family: var(--f-mayus); font-size: 17px; letter-spacing: .08em; color: var(--oro-claro); }
  .dos-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .con-icono { display: flex; align-items: center; gap: 10px; }
  .con-icono svg { width: 22px; height: 22px; color: var(--oro); }
  /* Imagen más chica, arriba de los objetivos */
  /* Letra más grande para que se lea bien en el celular */
  body { font-size: 17px; }
  .sub { font-size: 16px; }
  .ayuda { font-size: 15px; }
  .objetivos li { font-size: 16.5px; }
  .cuadro-pasos li, .puntos li, .guia ul { font-size: 17.5px; }
  .guia p { font-size: 18px; }
  .dato span { font-size: 14px; }
  .btn { font-size: 17px; }
  .btn-grande { font-size: 20px; padding: 20px 18px; border-radius: 20px; }

  /* ===== Modo claro (se elige en Ajustes) ===== */
  html[data-tema="claro"] {
    --noche: #FBF6EC; --noche-2: #FFFFFF; --noche-3: #F2E9D8;
    --oro: #B07A22; --oro-claro: #8A5A12; --crema: #2A2235; --gris: #6B6579;
    --linea: rgba(150, 105, 30, .22); --ok: #2E9E5E;
  }
  html[data-tema="claro"] body { background-image: radial-gradient(120% 60% at 50% -10%, #F3E2C0 0%, transparent 60%); }
  html[data-tema="claro"] .tabbar { background: rgba(255, 250, 240, .96); }
  html[data-tema="claro"] .tarjeta, html[data-tema="claro"] .guia, html[data-tema="claro"] details.extra, html[data-tema="claro"] .fluir { box-shadow: 0 2px 12px rgba(80, 55, 20, .06); }
  html[data-tema="claro"] .btn-oro { background: linear-gradient(180deg, #F6D27A, #E2A93F); color: #2A1C05; }
  html[data-tema="claro"] .toast { background: #2A2235; color: #FBF6EC; }
  html[data-tema="claro"] .dia-sem[aria-pressed="true"], html[data-tema="claro"] .progreso i.hecho { color: #fff; }
  html[data-tema="claro"] .btn-musica.on { background: #F6D27A; border-color: #E2A93F; }
  html[data-tema="claro"] .btn-cal { border: 1px solid var(--linea); }
  html[data-tema="claro"] .campo::placeholder { color: #9A93A8; }
  /* El cartel final mantiene sus colores oscuros (el logo es blanco). */
  html[data-tema="claro"] .cartel-fondo { --noche: #0D1020; --noche-2: #151A30; --oro: #E7B65A; --oro-claro: #F7DB97; --crema: #F4ECDD; --gris: #A8A3B8; --linea: rgba(231, 182, 90, .22); color: #F4ECDD; }
  html[data-tema="claro"] .cartel .btn-oro { background: linear-gradient(180deg, #F7DB97, #E7B65A); }
  .temas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .temas button { border: 1.5px solid var(--linea); background: var(--noche-2); color: var(--crema); border-radius: 14px; padding: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; font: inherit; font-weight: 800; cursor: pointer; }
  .temas button svg { width: 20px; height: 20px; }
  .temas button[aria-pressed="true"] { border-color: var(--oro); background: rgba(231, 182, 90, .14); color: var(--oro-claro); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  function vela(txt, boton) {
    var tag = boton ? 'button type="button" aria-label="Encender el altar"' : "div";
    return '<div class="altar-vela' + (encendida ? " encendida" : "") + '" id="vela"><div class="halo"></div>' +
      '<' + tag + ' class="vela">' + SVG_ALTAR + '</' + (boton ? "button" : "div") + '>' +
      '<p class="vela-txt">' + txt + '</p></div>';
  }

  function formularioInicio() {
    var h = D.horario;

      return '<div class="tarjeta pila centro"><span class="eyebrow">Solicitud enviada</span><h2>Esperando aprobación</h2>' +

    }
    if (hayServidor && recuperando) {
      return '<div class="tarjeta pila"><span class="eyebrow">Recuperar</span><h2>Ya usaban la app en otro celular</h2>' +
        '<p class="sub" style="margin:0">Escribí el <b>código de la familia</b>. Lo encontrás en <b>Ajustes</b> del celular anterior, o pedíselo a los pastores.</p>' +
        '<input class="campo codigo-campo" id="codRecuperar" placeholder="Ej: ABC-123" autocapitalize="characters" autocomplete="off">' +
        '<button type="button" class="btn btn-oro w100" data-accion="recuperar">Recuperar</button>' +
        '<button type="button" class="btn btn-borde btn-chico" style="justify-self:center" data-accion="no-recuperar">Volver</button></div>';
    }
    var rechazada = hayServidor && D.acceso === "rechazada";
    return (rechazada ? '<div class="tarjeta pila centro"><span class="eyebrow">Solicitud no aceptada</span><p class="sub" style="margin:0">Tu solicitud no fue aceptada. Hablá con los pastores o volvé a enviarla.</p></div>' : "") +
      '<div class="tarjeta pila"><span class="eyebrow">' + (hayServidor ? "Solicitar acceso" : "Para empezar") + '</span>' +
      (hayServidor ? '<p class="sub" style="margin:0">Completá los datos y solicitá el acceso.</p>' : "") +
      '<div><span class="lbl" style="margin-top:0">Nombre y apellido</span><div class="dos-campos">' +
        '<input class="campo" id="solNombre" value="' + esc(D.nombre || "") + '" placeholder="Nombre" aria-label="Nombre" autocomplete="given-name">' +
        '<input class="campo" id="nombreFamilia" value="' + esc(D.familia) + '" placeholder="Apellido" aria-label="Apellido" autocomplete="family-name"></div>' +
        '</div>' +
      '<div><label class="lbl" for="solDir" style="margin-top:0">Dirección</label><input class="campo" id="solDir" value="' + esc(D.direccion || "") + '" placeholder="Calle y número, ej: Liniers 125" autocomplete="street-address"></div>' +
      '<div><span class="lbl" style="margin-top:0">¿Qué día hacen el altar?</span><div class="dias-sem">' + [1, 2, 3, 4, 5, 6, 0].map(function(d) { return '<button type="button" class="dia-sem" data-hor-dia="' + d + '" aria-pressed="' + (h.dias.indexOf(d) !== -1) + '" aria-label="' + DL[d] + '">' + DS[d] + '</button>'; }).join("") + '</div></div>' +

  }
  function vInicio() {
    var html = '<img class="flyer" src="' + FLYER + '" alt="Altar en casa. Toda la tierra de Egipto había tinieblas y tocaron la oscuridad, pero en las casas de los israelitas había luz. Éxodo 10:23">';

  // ---------- La Palabra de la semana (para volver a meditar durante la semana) ----------

      : (avisos.listo && !avisos.soportado) ? '<p class="sub" style="margin:0">Este navegador no permite avisos. Abrí la app en Chrome.</p>'
      : '<button type="button" class="btn btn-oro w100" data-accion="activar-avisos">Activar avisos</button>';
    return '<div class="tarjeta pila"><h2 class="con-icono">' + ICONO_CAMPANA + 'Avisos en el celular</h2>' +
      '<p class="sub" style="margin:0">' + textoAvisos() + '</p>' + estado + '</div>';
  }
  // Android/Chrome ofrece instalar la app con un toque.
  var pedidoInstalar = null;
  window.addEventListener("beforeinstallprompt", function(e) { e.preventDefault(); pedidoInstalar = e; if (vista === "ajustes") pintar(); });
  window.addEventListener("appinstalled", function() { esInstalada = true; pedidoInstalar = null; toast("¡App instalada!"); if (vista === "ajustes") pintar(); });

  // ---------- Acceso directo en la pantalla del celular ----------
  // Una página dentro de Google no puede crear el ícono sola: se muestran los pasos del navegador.
  var verAcceso = false;
  function tarjetaAcceso() {
    var pasos = esIOS
      ? ["Abrí la app en <b>Safari</b>.", "Tocá el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).", "Elegí <b>Agregar a inicio</b>.", "Tocá <b>Agregar</b>."]
      : ["Abrí la app en <b>Chrome</b>.", "Tocá los <b>tres puntitos</b> de arriba a la derecha.", "Elegí <b>Agregar a la pantalla principal</b> (o <b>Instalar</b>).", "Tocá <b>Agregar</b>."];
    if (esWeb && esInstalada) return '<div class="tarjeta pila"><h2>App en el celular</h2><p class="ok-avisos">La app ya está en la pantalla de su celular.</p></div>';
    if (esWeb && pedidoInstalar) return '<div class="tarjeta pila"><h2>App en el celular</h2>' +
      '<p class="sub" style="margin:0">Instalala para abrir el altar desde un ícono, como cualquier app.</p>' +
      '<button type="button" class="btn btn-oro w100" data-accion="instalar-app">Instalar la app</button></div>';
    return '<div class="tarjeta pila"><h2>Acceso directo</h2>' +
      '<p class="sub" style="margin:0">Para abrir el altar desde un ícono en la pantalla del celular, como una app.</p>' +
      '<button type="button" class="btn btn-oro w100" data-accion="ver-acceso-directo">' + (verAcceso ? "Ocultar los pasos" : "Crear acceso directo") + '</button>' +
      (verAcceso ? '<ol class="pasos-alarma">' + pasos.map(function(p) { return '<li>' + p + '</li>'; }).join("") + '</ol>' +
        '<p class="ayuda" style="margin:0">Listo: les queda el ícono en la pantalla del celular.</p>' : "") + '</div>';
  }
  function vAjustes() {
    return '<div class="marca"><span class="pincel">Ajustes</span></div>' +
      tarjetaFamilia() +
      bloqueHorario("Día y hora del altar") +
      tarjetaAvisosAjustes() + tarjetaLetra() + tarjetaAcceso() +
      '<div class="tarjeta pila"><h2 class="con-icono">' + ICONO_ENGRANAJE + 'Reiniciar</h2>' +
      '<p class="sub" style="margin:0">Si encendieron el altar por error, pueden volver a la semana anterior y hacerlo de nuevo. Las semanas que ya hicieron no se borran.</p>' +
      '<button type="button" class="btn btn-borde w100" data-accion="semana-anterior">Volver a la semana anterior</button></div>';
  }
  function leerFamilia() { var a = $("famNombre"); if (a) D.familia = a.value.trim(); var b = $("famDir"); if (b) D.direccion = b.value.trim(); }

  // Carga en el celular los datos de una familia guardada en la planilla (por código o porque ya había pedido acceso).
  function cargarFamiliaRecuperada(r) {
    var dia = DL.indexOf(String(r.dia || "").toLowerCase());
    D.id = r.id; D.familia = r.apellido; D.integrantes = r.integrantes ? String(r.integrantes).split(/\s*,\s*/).filter(Boolean) : [];
    D.direccion = r.direccion || ""; D.acceso = r.estado || "pendiente";
    if (dia !== -1 && /^\d{2}:\d{2}$/.test(r.hora)) D.horario = { dias: [dia], hora: r.hora };
    D.hechos = {}; (r.altares || []).forEach(function(a) { D.hechos[a.lectura] = a.fecha; });
    D.peticiones = (r.peticiones || []).map(function(p) { return { id: p.id, por: p.por, motivo: p.detalle, creada: p.creada, respondida: p.respondida || null, testimonio: p.testimonio || "" }; });
    D.reflexiones = {}; (r.reflexiones || []).forEach(function(x) { D.reflexiones[x.lectura] = { texto: x.texto, fecha: x.fecha }; });
    D.turno = Object.keys(D.hechos).length;
  }

  // Cartel flotante de confirmación (Confirmar / Cancelar).
  // "Liniers125" → "Liniers 125"; "Moreno N°165" → "Moreno 165".
  function arreglarDir(d) {
    return String(d || "").replace(/\b(n[°ºo]\.?|nro\.?|n[uú]mero)\s*(?=\d)/gi, " ")
      .replace(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ.])(\d)/g, "$1 $2").replace(/(\d)([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2,})/g, "$1 $2").replace(/\s+/g, " ").trim();
  }
  // Si la dirección no tiene número, el mapa de la iglesia no puede ubicar la casa: se pregunta antes de seguir.
  function revisarDir(dir, boton, seguir) {
    if (!dir || /\d/.test(dir) || boton.dataset.dirOk === "1") { seguir(); return; }
    confirmar("¿Falta el número de la casa?", "Escribieron «" + esc(dir) + "». Sin la calle y el número (por ejemplo: Liniers 125) la iglesia no puede ubicar su casa en el mapa. Si no tienen número, pongan la calle y la esquina.",
      function() { boton.dataset.dirOk = "1"; boton.click(); }, "Enviar así", "Agregar el número");
  }
  function confirmar(titulo, texto, alConfirmar, txtSi, txtNo) {
    var viejo = $("confirmacion"); if (viejo) viejo.remove();
    var el = document.createElement("div");
    el.className = "modal-fondo"; el.id = "confirmacion";
    el.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTit"><h2 id="modalTit">' + titulo + '</h2><p>' + texto + '</p>' +
      '<div class="modal-botones"><button type="button" class="btn btn-borde" id="modalNo">' + (txtNo || "Cancelar") + '</button><button type="button" class="btn btn-oro" id="modalSi">' + (txtSi || "Confirmar") + '</button></div></div>';
    document.body.appendChild(el);
    function cerrar() { el.remove(); }
    $("modalNo").onclick = function(e) { e.stopPropagation(); cerrar(); };
    $("modalSi").onclick = function(e) { e.stopPropagation(); cerrar(); alConfirmar(); };
    el.onclick = function(e) { if (e.target === el) cerrar(); };
    $("modalNo").focus();
  }

  // ===================== ACCIONES =====================
  function encender() {
    encendida = true;
    var v = $("vela"); if (v) { v.classList.add("encendida"); var t = v.querySelector(".vela-txt"); if (t) t.textContent = "Hay luz en esta casa."; }
    sonidoFuego();
  }
  document.addEventListener("click", function(e) {
    var t = e.target.closest("button, a");
    if (!t) return;
    // Tocar el altar ya lo enciende y pasa al paso 1 (un solo toque, no dos).
    if (t.classList.contains("vela")) { var emp = document.querySelector('[data-accion="empezar"], [data-accion="continuar"]'); if (emp && !emp.disabled) emp.click(); return; }
    var d = t.dataset;
    if (d.ir) { if (d.ir === "inicio" && t.classList.contains("tab") && D.enCurso) { ir("altar/" + D.enCurso.paso); return; } ir(d.ir); return; }
    if (d.seg) { segOracion = d.seg; pintar(); return; }
    if (d.tema) { D.tema = d.tema; guardar(); aplicarTema(); document.querySelectorAll("[data-tema]").forEach(function(b) { if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b.dataset.tema === D.tema)); }); return; }
    if (d.letra) { D.letra = d.letra; guardar(); aplicarLetra(); document.querySelectorAll("[data-letra]").forEach(function(b) { b.setAttribute("aria-pressed", String(b.dataset.letra === D.letra)); }); return; }
    if (d.horDia) { document.querySelectorAll("[data-hor-dia]").forEach(function(b) { b.setAttribute("aria-pressed", String(b === t)); }); return; }
    if (d.quitar !== undefined) { leerFamilia(); D.integrantes.splice(Number(d.quitar), 1); guardar(); pintar(); return; }
    if (d.responder) { var r = $("resp-" + d.responder); r.hidden = !r.hidden; if (!r.hidden) $("testi-" + d.responder).focus(); return; }
    if (d.confirmarResp) { var p = D.peticiones.filter(function(x) { return x.id === d.confirmarResp; })[0]; p.respondida = hoyISO(); p.testimonio = $("testi-" + p.id).value.trim(); guardar(); enviar("guardarPeticion", datosPeticion(p)); toast("¡Gloria a Dios! Quedó como testimonio."); segOracion = "respondidas"; pintar(); return; }
    if (d.borrarPet) {
      if (t.dataset.ok !== "1") { t.dataset.ok = "1"; t.textContent = "Tocá de nuevo para borrar"; return; }
      D.peticiones = D.peticiones.filter(function(x) { return x.id !== d.borrarPet; }); guardar(); enviar("borrarPeticion", { id: d.borrarPet, familia: D.id }); pintar(); return;
    }
    switch (d.accion) {
      case "empezar":
        if (hechoEstaSemana()) { toast("El altar de esta semana ya está hecho."); return; }
        if (D.enCurso) { ir("altar/" + D.enCurso.paso); return; }
        lectura = proximaLectura(); t.disabled = true;
        D.enCurso = { lectura: lectura, paso: 1, inicio: Date.now(), acum: 0 }; guardar();
        enviar("altarEncendido", { familia: D.id });
        encender();
        setTimeout(function() { ir("altar/1"); }, 1100); break;
      case "continuar": if (D.enCurso) ir("altar/" + D.enCurso.paso); break;
      case "cancelar-altar":
        confirmar("¿Apagar este altar?", "Se apaga sin contarlo como hecho. Después pueden volver a empezarlo desde el principio.", function() {
          delete D.enCurso; guardar(); apagarMusica(); pararReloj(); encendida = false; pintar();
        }); break;
      case "siguiente":
        guardarReflexion(false);
        if (paso < 4) { try { history.pushState({ desde: paso }, "", "#altar/" + (paso + 1)); pintar(); } catch (e) { ir("altar/" + (paso + 1)); } }
        break;
      case "guardar-reflexion": guardarReflexion(true); break;
      case "atras":
        guardarReflexion(false);
        if (paso > 1) { if (history.state && history.state.desde === paso - 1) history.back(); else { try { history.replaceState(null, "", "#altar/" + (paso - 1)); } catch (e) {} pintar(); } }
        break;
      case "salir-altar": ir("inicio"); break;
      case "musica":
        if (musica.sonando) apagarMusica(); else prenderMusica();
        botonMusica();
        break;
      case "terminar":
        apagarMusica();
        var minutos = pararReloj();
        delete D.enCurso;
        try { history.replaceState(null, "", "#inicio"); } catch (e) {}
        if (!D.hechos[lectura]) D.hechos[lectura] = hoyISO();
        if (D.integrantes.length) D.turno++;
        guardar(); campana();
        enviar("registrarAltar", { familia: D.id, apellido: D.familia, lectura: lectura, fecha: D.hechos[lectura], minutos: minutos });
        vFinal(minutos); break;
      case "guardar-inicio":
        var sn = $("solNombre").value.trim(), nf = $("nombreFamilia").value.trim(), dsel = [];
        document.querySelectorAll("[data-hor-dia]").forEach(function(b) { if (b.getAttribute("aria-pressed") === "true") dsel.push(Number(b.dataset.horDia)); });
        var hh = $("horHora").value;
        if (!sn) { toast("Escribí tu nombre."); $("solNombre").focus(); return; }
        if (!nf) { toast("Escribí tu apellido."); $("nombreFamilia").focus(); return; }
        if (!dsel.length) { toast("Elegí el día del altar."); return; }
        if (!/^\d{2}:\d{2}$/.test(hh)) { toast("Elegí la hora."); return; }
        var dirSol = arreglarDir($("solDir").value); $("solDir").value = dirSol;
        if (dirSol && !/\d/.test(dirSol) && t.dataset.dirOk !== "1") { revisarDir(dirSol, t, function() {}); return; }
        D.nombre = sn; D.solicitante = sn + " " + nf; D.telefono = ""; D.direccion = dirSol;
        D.familia = nf; D.horario = { dias: [dsel[0]], hora: hh }; guardar();
        if (!hayServidor) { toast("¡Listo! Ya pueden encender el altar."); pintar(); break; }
        t.disabled = true; t.textContent = "Enviando…";
        google.script.run
          .withSuccessHandler(function(r) {
            if (r && typeof r === "object") {
              // Ya existía esta familia en la planilla: se recuperan sus datos y no se vuelve a pedir aprobación.
              if (r.familia) cargarFamiliaRecuperada(r.familia);
              D.acceso = r.estado; guardar();
            } else { D.acceso = r; guardar(); }
            toast(D.acceso === "aceptada" ? "¡Bienvenidos! Ya pueden encender el altar." : "Solicitud enviada"); pintar();
          })
          .withFailureHandler(function() { t.disabled = false; t.textContent = "Solicitar acceso"; toast("No se pudo enviar. Revisá la conexión a internet."); })
          .solicitarAcceso(datosFamilia());
        break;
      case "ver-acceso": consultarAcceso(true); break;
      case "corregir-solicitud": D.acceso = ""; guardar(); pintar(); break;
      case "ir-recuperar": recuperando = true; pintar(); break;
      case "no-recuperar": recuperando = false; pintar(); break;
      case "recuperar":
        var cod = $("codRecuperar").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (cod.length < 6) { toast("Escribí el código completo."); return; }
        t.disabled = true; t.textContent = "Buscando…";
        google.script.run.withSuccessHandler(function(r) {
          cargarFamiliaRecuperada(r);
          recuperando = false; guardar();
          toast("¡Listo! Recuperamos los datos de la familia " + D.familia + "."); pintar();
        }).withFailureHandler(function(e) { t.disabled = false; t.textContent = "Recuperar"; toast(e && e.message ? e.message : "No se pudo recuperar."); }).recuperarFamilia(cod);
        break;
      case "guardar-familia":
        if ($("famDir")) { $("famDir").value = arreglarDir($("famDir").value); var dF = $("famDir").value; if (dF && !/\d/.test(dF) && t.dataset.dirOk !== "1") { revisarDir(dF, t, function() {}); return; } }
        leerFamilia(); guardar(); enviar("registrarFamilia", datosFamilia()); toast("Guardado"); break;
      case "guardar-horario": leerFamilia(); guardarHorario(); break;
      case "cambiar-horario": leerFamilia(); editandoHorario = true; pintar(); var bh = $("bloqueHorario"); if (bh) bh.scrollIntoView({ block: "center" }); break;
      case "ics": descargarIcs(); toast(esAndroid ? "Tocá «Abrir» en el aviso de descarga." : "Abrí el archivo para agregarlo a tu calendario."); break;
      case "agregar-integrante": leerFamilia(); var nn = $("famNuevo").value.trim(); if (!nn) return; D.integrantes.push(nn); guardar(); pintar(); setTimeout(function() { var x = $("famNuevo"); if (x) x.focus(); }, 0); break;
      case "agregar-peticion":
        var por = $("petPor").value.trim();
        if (!por) { toast("Escribí por quién o por qué oran."); $("petPor").focus(); return; }
        var nueva = { id: Date.now().toString(36), por: por, motivo: $("petMotivo").value.trim(), creada: hoyISO(), respondida: null, testimonio: "" };
        D.peticiones.push(nueva); guardar(); enviar("guardarPeticion", datosPeticion(nueva));
        segOracion = "activas"; toast("Petición agregada"); pintar(); break;
      case "cerrar-cartel": var ct = $("cartel"); if (ct) ct.remove(); break;
      case "guia-alarma": verGuiaAlarma = !verGuiaAlarma; pintar(); var bh2 = $("bloqueHorario"); if (bh2 && verGuiaAlarma) bh2.scrollIntoView({ block: "start", behavior: "smooth" }); break;
      case "activar-avisos": activarAvisos(t); break;
      case "avisos-despues": D.avisosNo = Date.now(); guardar(); pintar(); break;
      case "instalar-app":
        if (pedidoInstalar) { pedidoInstalar.prompt(); pedidoInstalar.userChoice.then(function() { pedidoInstalar = null; pintar(); }); }
        break;
      case "ver-acceso-directo": verAcceso = !verAcceso; pintar(); var tb = document.querySelector('[data-accion="ver-acceso-directo"]'); if (tb && verAcceso) tb.scrollIntoView({ block: "center", behavior: "smooth" }); break;
      case "semana-anterior":
        var hechas = Object.keys(D.hechos).map(Number);
        if (!hechas.length) { toast("Todavía no encendieron ningún altar."); return; }
        var ultima = Math.max.apply(null, hechas), sU = SEMANAS[ultima - 1];
        confirmar("¿Volver a la semana anterior?",
          "Se va a borrar el último altar que hicieron (<b>Semana " + ultima + " · " + esc(sU.t) + "</b>) y van a poder hacerlo de nuevo. Las semanas anteriores no se borran.",
          function() {
            delete D.hechos[ultima]; if (D.integrantes.length && D.turno > 0) D.turno--; guardar();
            enviar("deshacerAltar", { familia: D.id, lectura: ultima });
            toast("Listo, pueden volver a hacer el altar de la semana " + ultima + "."); ir("inicio");
          });
        break;
    }
  });
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "famNuevo") document.querySelector('[data-accion="agregar-integrante"]').click();
    if (e.target.id === "nombreFamilia") e.target.blur();
  });
  window.addEventListener("hashchange", pintar);
  // Si quedó un altar a medio hacer de hace más de un día, se descarta.
  if (D.enCurso && Date.now() - D.enCurso.inicio > 24 * 3600000) { delete D.enCurso; guardar(); }
  if (/^#altar/.test(location.hash) && !D.enCurso) { try { history.replaceState(null, "", "#inicio"); } catch (e) {} }
  function consultarAcceso(avisar) {
    if (!hayServidor || !D.familia || !D.acceso) return;
    google.script.run.withSuccessHandler(function(estado) {
      var antes = D.acceso; D.acceso = estado; guardar();
      if (avisar && estado === "pendiente") toast("Todavía no fue aceptada. Probá de nuevo más tarde.");
      if (estado !== antes || avisar) { if (estado === "aceptada" && antes !== "aceptada") toast("¡Bienvenidos! Ya pueden encender el altar."); pintar(); }
    }).withFailureHandler(function() { if (avisar) toast("No se pudo consultar. Revisá la conexión a internet."); }).estadoAcceso(D.id);
  }
  aplicarLetra();
  aplicarTema();
  // Si llegan desde el link viejo de Google, traen su código: se recuperan sus datos solos.
  (function() {
    var m = /[?&]codigo=([A-Za-z0-9-]{6,8})/.exec(location.search);
    if (!m || !hayServidor) return;
    try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    if (D.familia && D.acceso) return;
    google.script.run.withSuccessHandler(function(r) {
      if (!r) return; cargarFamiliaRecuperada(r); guardar(); toast("¡Bienvenidos, familia " + D.familia + "!"); pintar();
    }).withFailureHandler(function() {}).recuperarFamilia(m[1].replace(/-/g, "").toUpperCase());
  })();
  iniciarAvisos();
  pintar();
  consultarAcceso(false);
  // Mientras espera la aprobación, la app se fija sola cada 30 segundos; cuando lo aceptan, entra directo al inicio.
  setInterval(function() { if (hayServidor && D.acceso === "pendiente" && !document.hidden) consultarAcceso(false); }, 30000);
  document.addEventListener("visibilitychange", function() { if (!document.hidden && hayServidor && D.acceso === "pendiente") consultarAcceso(false); });
  vaciarCola();
})();
</script>

</body>
